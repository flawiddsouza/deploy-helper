name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: binary-linux
            binary_path: ./target/x86_64-unknown-linux-musl/release/deploy-helper
            upload_name: deploy-helper-linux
          # - os: macos-latest
          #   artifact_name: binary-macos
          #   binary_path: ./target/release/deploy-helper
          #   upload_name: deploy-helper-macos
          - os: windows-latest
            artifact_name: binary-windows
            binary_path: ./target/release/deploy-helper.exe
            upload_name: deploy-helper-windows.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Verify release tag matches Cargo version
      shell: pwsh
      run: |
        $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
        $packageVersion = ($metadata.packages | Where-Object name -eq 'deploy-helper').version
        $expectedTag = "v$packageVersion"
        if ($env:GITHUB_REF_NAME -ne $expectedTag) {
          throw "Release tag '$env:GITHUB_REF_NAME' does not match Cargo package version '$packageVersion'. Expected '$expectedTag'."
        }

    - name: Build for macOS
      if: matrix.os == 'macos-latest'
      run: cargo build --release

    - name: Build for linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get install -y musl-tools
        rustup target add x86_64-unknown-linux-musl
        cargo build --release --target x86_64-unknown-linux-musl

    - name: Build for Windows
      if: matrix.os == 'windows-latest'
      run: cargo build --release

    - name: Rename binary (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: mv ${{ matrix.binary_path }} ${{ matrix.upload_name }}

    - name: Rename binary (Windows)
      if: matrix.os == 'windows-latest'
      run: Move-Item -Path ${{ matrix.binary_path }} -Destination ${{ matrix.upload_name }}

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ matrix.upload_name }}
        generate_release_notes: true
