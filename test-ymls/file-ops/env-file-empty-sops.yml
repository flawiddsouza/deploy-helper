- name: Preserve the destination when SOPS decrypts no entries
  hosts: test
  tasks:
    - name: Create the fixture directory
      file:
        path: /tmp/deploy-helper-test-env-file-empty-sops
        state: directory

    - name: Write defaults
      copy:
        content: |
          SECRET_TOKEN=
        dest: /tmp/deploy-helper-test-env-file-empty-sops/.env.defaults

    - name: Write the existing destination
      copy:
        content: |
          EXISTING=preserved
        dest: /tmp/deploy-helper-test-env-file-empty-sops/.env
        mode: "0600"

    - name: Write an empty SOPS fixture
      copy:
        content: |
          TEST_SOPS_EMPTY
        dest: /tmp/deploy-helper-test-env-file-empty-sops/secrets.enc.env

    - name: Materialize with empty decrypted secrets
      chdir: /tmp/deploy-helper-test-env-file-empty-sops
      env_file:
        defaults: .env.defaults
        secrets:
          provider: sops
          src: secrets.enc.env
        dest: .env
        mode: "0600"
