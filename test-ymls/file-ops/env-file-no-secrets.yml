- name: Build an environment file without secrets
  hosts: test
  tasks:
    - name: Create the fixture directory
      file:
        path: /tmp/deploy-helper-test-env-file-no-secrets
        state: directory

    - name: Write defaults
      copy:
        content: |
          APP_REF=old
          NODE_ENV=production
        dest: /tmp/deploy-helper-test-env-file-no-secrets/.env.defaults

    - name: Materialize without secrets
      chdir: /tmp/deploy-helper-test-env-file-no-secrets
      env_file:
        defaults: .env.defaults
        values:
          APP_REF: new
        dest: .env
        mode: "0600"

    - name: Verify the values-only overlay
      chdir: /tmp/deploy-helper-test-env-file-no-secrets
      shell: |
        grep -qx 'APP_REF=new' .env
        grep -qx 'NODE_ENV=production' .env
        test "$(grep -c '^APP_REF=' .env)" -eq 1
        stat -c 'NO_SECRETS_PERMS=%a' .env
