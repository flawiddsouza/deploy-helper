- name: Verify password-authenticated doas output
  hosts: test
  tasks:
    - name: Match clean command output after doas authentication
      become: true
      become_method: doas
      verify:
        command: printf '  %s' "$(whoami)"
        expect:
          equals: "  root"
      register: verify_doas

    - name: Show the registered doas output
      debug:
        msg: "{{ verify_doas.stdout }}"
